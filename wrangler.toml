# Cloudflare Worker: serves public/ as static files; /api/* runs src/worker.js.
name = "photo-shoot-flat-lay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Keep keys added in the Cloudflare dashboard when a new version deploys.
keep_vars = true
# Keep the free photo-shoot-flat-lay.<account>.workers.dev address switched on.
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Always send /api/* to the Worker code, never to the static files.
run_worker_first = ["/api/*"]

# Cloudflare Images: background removal for photos of pieces the family owns.
[images]
binding = "IMAGES"
